<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro do Jogador</title>
    <link rel="stylesheet" href="formEstilo.css"> 
</head>
<body>

    <div class="form-container">
        <h1>Cadastro do Jogador</h1>

        <form id="cadastroForm">

            <label>Nome do jogador:</label>
            <input type="text" id="nome" required>

            <label>Idade:</label>
            <input type="number" id="idade" required min="10">

            <label>Email:</label>
            <input type="email" id="email" required>


            <label class="checkbox-main">
                <input type="checkbox" id="termos" required>
                Aceito os termos de uso
            </label>

            <label class="checkbox-main">
            <input type="checkbox" id="novidades"> Desejo receber novidades
            </label>

            <div id="categoriasNovidades" style="display: none;"></div>


            <button type="submit">Registrar</button>
        </form>

        <p id="erro" class="erro"></p>
        <p id="sucesso" class="sucesso"></p>
    </div>

    <script src="formScript.js"></script>
</body>
</html>
